#自定义 Spring Boot 项目中静态资源（如 HTML、CSS、JS、图片等）的存放目录
spring.resources.static-locations = classpath:/resources/,classpath:/static/,classpath:/public/


spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.servlet.content-type=text/html
spring.thymeleaf.encoding=utf-8
spring.thymeleaf.mode=HTML
spring.thymeleaf.cache=false
# 在 Spring Boot 启动时，检查 Thymeleaf 模板文件的存放目录是否存在
spring.thymeleaf.check-template-location=true

#全局配置 JSON 日期时间格式
spring.jackson.timeZone=GMT+08:00
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.serialization.write_dates_as_timestamps=false \

