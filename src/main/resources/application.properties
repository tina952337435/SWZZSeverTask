# swzzmode 数据库连接配置******************************************************************************
spring.datasource.swzzmode.jdbc-url=jdbc:dm://10.91.4.120:55236
spring.datasource.swzzmode.username=SWZZ_MODE
spring.datasource.swzzmode.password=Swzz~CY3k
spring.datasource.swzzmode.driver-class-name=dm.jdbc.driver.DmDriver
# --- HikariCP 核心连接池配置 ---
spring.datasource.swzzmode.hikari.maximum-pool-size=20
# 建议与 maximum-pool-size 保持一致，避免动态创建连接的延迟
spring.datasource.swzzmode.hikari.minimum-idle=20 
# 建议调小为 3秒，高并发下快速失败，防止线程长时间阻塞
spring.datasource.swzzmode.hikari.connection-timeout=3000 
# 保持 30分钟，注意必须小于数据库的 wait_timeout
spring.datasource.swzzmode.hikari.max-lifetime=1800000 
# 当 minimum-idle 与 max 相等时，此参数不生效，保留即可
spring.datasource.swzzmode.hikari.idle-timeout=600000 
# 建议去掉！让 HikariCP 使用原生 isValid() 方法检测，性能更好
# spring.datasource.swzzmode.hikari.connection-test-query=SELECT 1 
# 生产环境排查连接泄漏非常有用，保留
spring.datasource.swzzmode.hikari.leak-detection-threshold=60000
